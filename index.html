<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#121A2B">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
  <div id="app">
    <header class="app-head">

    <nav id="nav" class="nav" role="tablist" aria-label="التنقل"></nav>

  <div id="sheets"></div>
  <div id="toast" class="toast-host" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="vendor/html5-qrcode.min.js" defer></script>
